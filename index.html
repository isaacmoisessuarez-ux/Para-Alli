<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allisson ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0b0618;color:#fff;font-family:'Quicksand',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:6}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:2}
.card{position:relative;width:min(92vw,440px);padding:40px 30px 36px;border-radius:30px;text-align:center;
 background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
 border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
 box-shadow:0 24px 70px rgba(255,70,130,.28),inset 0 1px 0 rgba(255,255,255,.45);
 transition:width .9s ease,padding .9s ease;animation:float 6s ease-in-out infinite}
.card.letter{width:min(94vw,560px);max-height:88vh;overflow:auto;text-align:left;animation:none}
@keyframes float{50%{transform:translateY(-8px)}}
.view{transition:opacity .65s ease,transform .65s ease,filter .65s ease}
.view.out{opacity:0;transform:scale(.92);filter:blur(8px)}
[hidden]{display:none!important}
.beat{font-size:56px;display:inline-block;animation:beat 1.3s ease-in-out infinite;filter:drop-shadow(0 0 18px #ff4d8d)}
@keyframes beat{14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.18)}70%{transform:scale(1)}}
h1{font-family:'Dancing Script',cursive;font-size:clamp(36px,10vw,52px);line-height:1.1;margin:10px 0 6px;
 background:linear-gradient(90deg,#ffd6e7,#ff8fb8,#ffd6e7);-webkit-background-clip:text;background-clip:text;color:transparent}
.ask{font-size:clamp(19px,5vw,23px);color:#ffe6ef;letter-spacing:.2px}
.btns{display:flex;gap:26px;justify-content:center;align-items:center;margin-top:32px;min-height:64px}
button{font:inherit;cursor:pointer;border:0;color:#fff}
#yesWrap{position:relative;display:inline-block}
#yes{position:relative;z-index:2;padding:15px 44px;font-size:20px;font-weight:600;border-radius:999px;
 background:linear-gradient(135deg,#ff5c9a,#e3112f);transform:scale(var(--g,1));transition:transform .5s cubic-bezier(.34,1.56,.64,1);
 animation:pulse 1.6s ease-in-out infinite}
#yes:hover{filter:brightness(1.12)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,60,120,.65),0 8px 26px rgba(227,17,47,.45)}50%{box-shadow:0 0 0 16px rgba(255,60,120,0),0 8px 34px rgba(255,90,150,.7)}}
.sp{position:absolute;pointer-events:none;z-index:3;font-size:16px;animation:sp 1.1s ease-out forwards}
@keyframes sp{from{opacity:1;transform:translate(0,0) scale(.4)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(120deg)}}
#noWrap{position:relative;display:inline-block}
#no{position:absolute;left:0;top:0;z-index:4;white-space:nowrap;padding:15px 30px;font-size:18px;border-radius:999px;
 background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);transition:transform .55s cubic-bezier(.34,1.4,.5,1)}
.from{margin-top:22px;font-family:'Dancing Script',cursive;font-size:26px;color:#ffb3cf}
.lt-h{font-family:'Dancing Script',cursive;font-size:clamp(32px,8vw,44px);color:#ffd6e7;margin-bottom:14px}
.lt-b p{font-size:17px;line-height:1.7;color:#fff0f5;margin-bottom:14px;white-space:pre-wrap}
.rise p,.rise .from,.rise .lt-h{opacity:0;animation:rise .9s ease forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.glass{background:rgba(20,8,38,.55);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.player{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;border-radius:999px}
.player button{background:rgba(255,255,255,.14);border-radius:50%;width:36px;height:36px;font-size:15px}
.player button:hover{background:rgba(255,255,255,.28)}
.player .up{border-radius:999px;width:auto;padding:0 12px;font-size:12px}
.player input[type=range]{width:64px;accent-color:#ff5c9a}
#trk{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
:focus-visible{outline:2px solid #ffd6e7;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card,.beat,#yes{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="stage">
  <main class="card" id="card">
    <section class="view" id="qv">
      <div class="beat">💖</div>
      <h1 id="nm"></h1>
      <p class="ask" id="q"></p>
      <div class="btns">
        <span id="yesWrap"><button id="yes">Sí 💕</button></span>
        <span id="noWrap"><button id="no">No</button></span>
      </div>
    </section>
    <section class="view out" id="lv" hidden>
      <div class="lt-h" id="ltH"></div>
      <div class="lt-b" id="ltB"></div>
      <div class="from" id="ltF"></div>
    </section>
  </main>
</div>

<canvas id="fx"></canvas>

<div class="player glass">
  <button id="pp" title="Reproducir / pausar" aria-label="Reproducir o pausar">▶</button>
  <span id="trk">Mantecado de coco</span>
  <input type="range" id="vol" min="0" max="1" step=".01" value=".6" aria-label="Volumen">
  <button class="up" id="upBtn" title="Subir tu propio MP3">♪ Subir MP3</button>
</div>
<input type="file" id="file" accept="audio/*" hidden>

<script>
const $=s=>document.querySelector(s);
/* ---------- Textos (edita aquí) ---------- */
const S={name:'Allis',q:'¿Quieres volver conmigo?',from:'Isuchiemo',
letter:`Si pusiste que si gracias mi toda Allisson

Gracias por haber dicho que si, te extrañe mucho, extrañaba las caricias que me hacias en el cabello y tambien decirte mi amor, obviamente tambien decirte lo mucho que te amo
y te hice esto por que tal vez no nos veamos hasta quien sabe cuando
te amo mucho mi linda

Eres mi amorcito ♥`};
function renderQ(){$('#nm').textContent=S.name+',';$('#q').textContent=S.q}
function renderL(anim){
  $('#ltH').textContent='Para ti, '+S.name;
  const b=$('#ltB');b.innerHTML='';
  S.letter.replace(/\{nombre\}/gi,S.name).split(/\n\s*\n/).forEach((t,i)=>{
    const p=document.createElement('p');p.textContent=t;if(anim)p.style.setProperty('--d',(.5+i*.7)+'s');b.appendChild(p)});
  $('#ltF').textContent='Con todo mi amor, '+S.from;
  const n=b.children.length;
  if(anim){$('#ltH').style.setProperty('--d','.1s');$('#ltF').style.setProperty('--d',(.6+n*.7)+'s')}
  $('#lv').classList.toggle('rise',!!anim);
}
renderQ();renderL(false);

/* ---------- Canvas: estrellas, luz cálida y corazones ---------- */
const bg=$('#bg'),fx=$('#fx'),b=bg.getContext('2d'),f=fx.getContext('2d');
let W,H,stars=[],hearts=[],conf=[],mx=.5,my=.4,tmx=.5,tmy=.4,rainUntil=0;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of[bg,fx]){c.width=W*d;c.height=H*d}b.setTransform(d,0,0,d,0,0);f.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:Math.min(280,W*H/4500|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6.28,s:.6+Math.random()*1.8,z:Math.random()}))}
function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.3);c.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);
  c.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);c.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);
  c.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);c.fill()}
const hc=['255,120,170','255,80,120','255,170,200','255,140,110'];
function addHeart(x,y,burst){hearts.push({x:x??Math.random()*W,y:y??H+30,s:burst?8+Math.random()*14:12+Math.random()*26,
  vy:burst?-(60+Math.random()*90):-(18+Math.random()*34),vx:burst?(Math.random()-.5)*90:0,p:Math.random()*6.28,
  a:burst?.8:.18+Math.random()*.3,c:hc[Math.random()*4|0],life:burst?1:0})}
addEventListener('pointermove',e=>{tmx=e.clientX/W;tmy=e.clientY/H});
addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;for(let i=0;i<7;i++)addHeart(e.clientX,e.clientY,true)});
const cols=['#ff4d8d','#ff1744','#ffd166','#ffffff','#ff9ecb','#c77dff'];
function spawnConf(n){for(let i=0;i<n;i++)conf.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*140,vy:90+Math.random()*200,
  rx:Math.random()*6.28,vrx:3+Math.random()*7,rz:Math.random()*6.28,vrz:(Math.random()-.5)*7,w:7+Math.random()*9,h:11+Math.random()*10,
  c:cols[Math.random()*6|0],hs:Math.random()<.4,s:14+Math.random()*16})}
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05),t=now/1000;last=now;
  mx+=(tmx-mx)*.05;my+=(tmy-my)*.05;
  const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0618');g.addColorStop(.6,'#2a0b3d');g.addColorStop(1,'#4d1139');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  const lg=b.createRadialGradient(mx*W,my*H,0,mx*W,my*H,Math.max(W,H)*.55);
  lg.addColorStop(0,'rgba(255,170,100,.28)');lg.addColorStop(.4,'rgba(255,110,140,.12)');lg.addColorStop(1,'rgba(255,110,140,0)');
  b.fillStyle=lg;b.fillRect(0,0,W,H);
  for(const s of stars){const x=s.x+(mx-.5)*s.z*40,y=s.y+(my-.5)*s.z*40,a=.35+.65*Math.abs(Math.sin(t*s.s+s.p));
    b.fillStyle=`rgba(255,${230-s.z*40|0},${200-s.z*60|0},${a})`;b.beginPath();b.arc(x,y,s.r,0,6.28);b.fill()}
  acc+=dt;if(acc>.7){acc=0;if(hearts.length<34)addHeart()}
  for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.y+=h.vy*dt;h.x+=h.vx*dt+Math.sin(t+h.p)*.35;
    if(h.life){h.vy*=.985;h.vx*=.985;h.a-=dt*.5}
    if(h.y<-40||h.a<=0){hearts.splice(i,1);continue}
    b.fillStyle=`rgba(${h.c},${h.a})`;b.shadowColor=`rgba(${h.c},.8)`;b.shadowBlur=12;heart(b,h.x,h.y,h.s)}
  b.shadowBlur=0;
  f.clearRect(0,0,W,H);
  if(now<rainUntil)spawnConf(3);
  for(let i=conf.length-1;i>=0;i--){const p=conf[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.995;p.rx+=p.vrx*dt;p.rz+=p.vrz*dt;
    if(p.y>H+40){conf.splice(i,1);continue}
    const k=Math.cos(p.rx);f.save();f.translate(p.x,p.y);f.rotate(p.rz);f.scale(1,k);f.globalAlpha=.65+.35*Math.abs(k);f.fillStyle=p.c;
    if(p.hs)heart(f,0,-p.s/2,p.s);else f.fillRect(-p.w/2,-p.h/2,p.w,p.h);f.restore()}
  requestAnimationFrame(frame)}
size();requestAnimationFrame(frame);

/* ---------- Botón "No" travieso ---------- */
const no=$('#no'),yes=$('#yes'),nw=$('#noWrap');
const P=['No','di que si','si, si','si, si, si','ya pon que si','si pero si'];
let nc=0;
function sizeNo(){nw.style.width=no.offsetWidth+'px';nw.style.height=no.offsetHeight+'px'}
function resetNo(){no.style.transform='';nc=0;no.textContent=P[0];yes.style.setProperty('--g',1);sizeNo()}
function flee(e){
  if(e&&e.cancelable)e.preventDefault();
  no.textContent=P[(++nc)%P.length];
  const o=nw.getBoundingClientRect(),bw=no.offsetWidth,bh=no.offsetHeight,y=yes.getBoundingClientRect();
  let tx,ty,n=0;
  do{tx=14+Math.random()*(W-bw-28);ty=14+Math.random()*(H-bh-28);n++}
  while(n<25&&tx<y.right+24&&tx+bw>y.left-24&&ty<y.bottom+24&&ty+bh>y.top-24);
  no.style.transform=`translate(${tx-o.left}px,${ty-o.top}px)`;
  yes.style.setProperty('--g',Math.min(1+nc*.04,1.3));
}
no.addEventListener('pointerenter',flee);
no.addEventListener('pointerdown',flee);
no.addEventListener('click',flee);
no.addEventListener('focus',flee);
addEventListener('resize',()=>{size();resetNo()});
resetNo();

/* ---------- Destellos del botón "Sí" ---------- */
setInterval(()=>{if($('#qv').hidden)return;
  const s=document.createElement('span'),r=yes.getBoundingClientRect();
  s.className='sp';s.textContent=['✦','♥','✧','❤','✨'][Math.random()*5|0];
  s.style.color=['#ff4d8d','#ff1744','#ff9ecb','#ffd1e1'][Math.random()*4|0];
  s.style.left=(Math.random()*r.width)+'px';s.style.top=(Math.random()*r.height)+'px';
  s.style.setProperty('--dx',(Math.random()-.5)*110+'px');s.style.setProperty('--dy',(Math.random()-.5)*90+'px');
  $('#yesWrap').appendChild(s);setTimeout(()=>s.remove(),1100)},170);

/* ---------- Celebración y carta ---------- */
const qv=$('#qv'),lv=$('#lv'),card=$('#card');
yes.onclick=()=>{
  spawnConf(170);rainUntil=performance.now()+7000;
  for(let i=0;i<24;i++)addHeart(Math.random()*W,H*.9,true);
  qv.classList.add('out');
  setTimeout(()=>{qv.hidden=true;lv.hidden=false;card.classList.add('letter');renderL(true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>lv.classList.remove('out')))},650)};

/* ---------- Música: tu canción (MP3) ---------- */
let playing=false,touched=false;
const aud=new Audio("alvaro-diaz-mantecado-de-coco-official-video-1_iuSoS9VR.mp3");aud.loop=true;aud.volume=.6;
function setUI(){$('#pp').textContent=playing?'⏸':'▶'}
function play(){touched=true;aud.play().catch(()=>{});playing=true;setUI()}
function pause(){aud.pause();playing=false;setUI()}
$('#pp').onclick=()=>playing?pause():play();
$('#vol').oninput=e=>{aud.volume=+e.target.value};
addEventListener('pointerdown',e=>{if(touched||e.target.closest('.player'))return;play()});
const fi=$('#file');
$('#upBtn').onclick=()=>fi.click();
fi.onchange=()=>{const fl=fi.files[0];if(!fl)return;
  aud.src=URL.createObjectURL(fl);$('#trk').textContent=fl.name;$('#trk').title=fl.name;play()};
</script>
</body>
</html>
